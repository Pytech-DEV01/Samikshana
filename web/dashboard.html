<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sahayog — role-based MPLADS workspace for citizens, MP offices and contractors.">
  <title>Sahayog · Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="dashboard-page">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="side-brand" href="dashboard.html">
        <span class="side-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="32" cy="32" r="5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="1.4">
              <line x1="32" y1="5" x2="32" y2="59"/>
              <line x1="32" y1="5" x2="32" y2="59" transform="rotate(30 32 32)"/>
              <line x1="32" y1="5" x2="32" y2="59" transform="rotate(60 32 32)"/>
              <line x1="32" y1="5" x2="32" y2="59" transform="rotate(90 32 32)"/>
              <line x1="32" y1="5" x2="32" y2="59" transform="rotate(120 32 32)"/>
              <line x1="32" y1="5" x2="32" y2="59" transform="rotate(150 32 32)"/>
            </g>
          </svg>
        </span>
        <span class="side-wordmark">
          <span class="side-name">Sahayog</span>
          <span class="side-sub">MPLADS Portal</span>
        </span>
      </a>

      <div class="side-session">
        <span class="side-session-label">Signed in as</span>
        <div class="side-session-card">
          <span class="avatar" id="sideAvatar">A</span>
          <span class="side-session-text">
            <strong id="sideName">—</strong>
            <span id="sideRole">—</span>
          </span>
        </div>
      </div>

      <nav class="side-nav" id="sideNav" aria-label="Workspace sections"></nav>

      <div class="access-card" id="accessCard">
        <span class="access-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="9.5" rx="2"/>
            <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
          </svg>
          Your access
        </span>
        <p id="accessCopy">—</p>
      </div>

      <div class="side-foot">
        <span class="side-foot-note" id="sideFootNote">Prototype build · demo data</span>
        <button class="logout" id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/>
            <path d="M10 12h10M17 9l3 3-3 3"/>
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="topbar-title">
          <span class="crumb">MPLADS Workspace</span>
          <h1 id="viewTitle">Overview</h1>
        </div>
        <div class="topbar-right">
          <span class="role-pill" id="rolePill">
            <span class="role-pill-dot" aria-hidden="true"></span>
            <span id="rolePillText">—</span>
          </span>
          <span class="topbar-date" id="topDate">—</span>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal">
      <header class="modal-head">
        <div>
          <span class="modal-eyebrow" id="modalEyebrow"></span>
          <h2 id="modalTitle"></h2>
        </div>
        <button class="icon-btn" type="button" data-action="close-modal" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toastText"></span>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
